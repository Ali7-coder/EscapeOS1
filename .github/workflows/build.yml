name: Build EscapeOS Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EscapeOS IPA
    runs-on: macos-14
    timeout-minutes: 20
    
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 2. Install System Tools
        run: |
          brew install ldid dpkg gzip

      - name: 3. Install Rust (Required for idevice_ffi)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 4. Setup Theos via Verified Action
        # استخدام الأداة الرسمية المعتمدة أمنياً داخل سيرفرات GitHub بدون أي Curl أو Git يدوي
        uses: theos/setup-theos-action@v1
        with:
          theos-src: https://github.com
          theos-sdks: https://github.com

      - name: 5. Compile and Package IPA
        run: |
          set -e
          # استدعاء أمر البناء الصارم المتوافق مع ملف الـ Makefile الخاص بك
          make package \
            FINALPACKAGE=1 \
            TARGET="iphone:clang:16.5:18.0" \
            ARCHS=arm64 \
            -j$(sysctl -n hw.ncpu)

      - name: 6. Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-Final-IPA
          path: packages/*.ipa
          if-no-files-found: error
