name: Build EscapeOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EscapeOS IPA
    runs-on: macos-14
    timeout-minutes: 20
    
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 2. Install System Tools
        run: |
          brew install ldid dpkg gzip

      - name: 3. Setup Theos and iOS SDK
        run: |
          set -e
          # تثبيت الأداة الرسمية في مسار الخادم
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          
          # تحميل الـ SDK 16.5 الرسمي وفكه مباشرة
          curl -sL https://github.com | tar -xz -C $HOME --strip-components=1
          mkdir -p $THEOS/sdks
          cp -R $HOME/iPhoneOS16.5.sdk $THEOS/sdks/
          
          # تمرير المسارات للخطوات التالية
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: 4. Compile and Package IPA
        run: |
          set -e
          echo "======================================"
          echo "STARTING THEOS COMPILATION"
          echo "======================================"
          make clean || true
          
          # أمر البناء الصارم المطابق لملف الـ Makefile الخاص بك
          make package \
            FINALPACKAGE=1 \
            TARGET="iphone:clang:16.5:18.0" \
            ARCHS=arm64 \
            -j$(sysctl -n hw.ncpu)

      - name: 5. Upload Output IPA
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-Final-IPA
          path: packages/*.ipa
          if-no-files-found: error
