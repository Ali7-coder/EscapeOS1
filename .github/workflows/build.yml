name: Build EscapeOSPro

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      # الخطوة 1: استلام الكود (باستخدام الإصدار الجديد)
      - name: Checkout code
        uses: actions/checkout@v5

      # الخطوة 2: تثبيت الأدوات المفقودة (الحل الأساسي)
      - name: Install missing tools
        run: |
          brew install gzip tar

      # الخطوة 3: تهيئة بيئة Theos
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      # الخطوة 4: بناء التطبيق باستخدام Theos
      - name: Build with Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      # الخطوة 5: رفع ملف الـ IPA كقطعة أثرية
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOSPro-IPA
          path: ./*.ipa

      # الخطوة 6: إنشاء إصدار ورفع الملف
      - name: Create Release and Upload IPA
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          gh release create "$TAG_NAME" ./*.ipa \
            --title "EscapeOSPro ${{ github.run_number }}" \
            --prerelease \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
