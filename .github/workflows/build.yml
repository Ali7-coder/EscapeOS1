name: Build EscapeOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EscapeOS IPA
    runs-on: macos-14
    timeout-minutes: 20
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew install ldid dpkg gzip

      - name: Initialize Theos Environment
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: "${{ github.workspace }}/theos"
          theos-src: "https://github.com"
          theos-sdks: "https://github.com"

      - name: Deploy Exact iOS 16.5 SDK
        run: |
          export THEOS="${{ github.workspace }}/theos"
          # جلب حزمة الـ SDK المطابقة لملف التحضير الخاص بالمشروع
          curl -LO https://github.com/raw/master/iPhoneOS16.5.sdk.tar.xz
          mkdir -p $THEOS/sdks
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Compile and Package IPA
        env:
          THEOS_VERBOSE: 1
        run: |
          set -e
          export THEOS="${{ github.workspace }}/theos"
          
          echo "======================================"
          echo "RUNNING MAKE CLEAN & PACKAGE"
          echo "======================================"
          make clean || true
          
          # أمر البناء الصارم المطابق لبنية معمارية معالجات آيفون الحديثة (arm64)
          make package \
            FINALPACKAGE=1 \
            TARGET="iphone:clang:16.5:18.0" \
            ARCHS=arm64 \
            -j$(sysctl -n hw.ncpu)

      - name: Process Output Artifacts
        run: |
          set -e
          echo "======================================"
          echo "LOCATING GENERATED IPA"
          echo "======================================"
          find . -type f -name "*.ipa" -print
          
          # العثور على ملف الـ IPA الناتج ونقله للمجلد الرئيسي لتسهيل رفعه
          OUTPUT_IPA="$(find . -type f -name "*.ipa" -print -quit)"
          if [ -z "$OUTPUT_IPA" ]; then
            echo "::error::No IPA package was found in the target directory."
            exit 1
          fi
          cp "$OUTPUT_IPA" EscapeOS.ipa
          ls -lh EscapeOS.ipa

      - name: Export IPA as Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-Final-IPA
          path: EscapeOS.ipa
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # إنشاء إصدار عام وتحميل الملف تلقائياً لتنزيله مباشرة من المتصفح
          gh release create "v1.0.${{ github.run_number }}" EscapeOS.ipa \
            --title "EscapeOS Release v1.0.${{ github.run_number }}" \
            --notes "Automated clean build generated by GitHub Actions." || true
