name: Build EscapeOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EscapeOS IPA via Native Clang
    runs-on: macos-14
    timeout-minutes: 20
    
    steps:
      - name: 1. Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 2. Install Package Tools
        run: |
          brew install ldid dpkg gzip

      - name: 3. Setup Internal Theos Environment
        run: |
          set -e
          # سحب أداة Theos محلياً بالكامل عبر أداة جيت هوب المحصنة بدلاً من curl
          git clone --recursive https://github.com $HOME/theos
          
          # جلب الـ SDK 16.5 الرسمي وسحبه داخل النظام محلياً
          git clone --depth=1 https://github.com $HOME/theos-sdks
          mkdir -p $HOME/theos/sdks
          cp -R $HOME/theos-sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/
          
          # تسجيل المسارات الصارمة داخل الخادم
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: 4. Compile and Package IPA via Theos Engine
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          
          echo "======================================"
          echo "EXECUTING COMPILATION"
          echo "======================================"
          make clean || true
          
          # استدعاء ملف الـ Makefile لتجميع ملفات الـ Swift والـ C معاً بشكل متوافق
          make package \
            FINALPACKAGE=1 \
            TARGET="iphone:clang:16.5:18.0" \
            ARCHS=arm64 \
            -j$(sysctl -n hw.ncpu)

      - name: 5. Export Final IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-Final-IPA
          path: packages/*.ipa
          if-no-files-found: error
