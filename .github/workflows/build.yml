name: Build EscapeOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EscapeOS IPA
    runs-on: macos-14
    timeout-minutes: 25
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Tools
        run: |
          brew install ldid dpkg gzip

      - name: Install & Configure Rust (Required for idevice_ffi)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install Theos Directly
        run: |
          set -e
          # تثبيت أداة Theos الرسمية يدوياً في مسار مسجل داخل الخادم
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://githubusercontent.com)"
          
          # تثبيت الـ SDK 16.5 المطلوب وفكه في مسار البيئة الافتراضية الصحيح
          curl -LO https://github.com
          mkdir -p $THEOS/sdks
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm iPhoneOS16.5.sdk.tar.xz
          
          # حفظ متغيرات البيئة لكي تراها الخطوات التالية في جيت هوب
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Verify Dependencies & Static Libraries
        run: |
          echo "Checking for idevice_ffi static library..."
          if [ -d "EscapeOS/Tunnel" ]; then
            ls -la EscapeOS/Tunnel
          else
            echo "::warning::Tunnel directory not found!"
          fi

      - name: Compile and Package IPA
        env:
          THEOS_VERBOSE: 1
        run: |
          set -e
          
          echo "======================================"
          echo "RUNNING MAKE CLEAN & PACKAGE"
          echo "======================================"
          make clean || true
          
          # البناء بالاعتماد الكامل على المسار والمتغيرات المطابقة للمشروع
          make package \
            FINALPACKAGE=1 \
            TARGET="iphone:clang:16.5:18.0" \
            ARCHS=arm64 \
            -j$(sysctl -n hw.ncpu)

      - name: Process Output Artifacts
        run: |
          set -e
          echo "======================================"
          echo "LOCATING GENERATED IPA"
          echo "======================================"
          find . -type f -name "*.ipa" -print
          
          OUTPUT_IPA="$(find . -type f -name "*.ipa" -print -quit)"
          if [ -z "$OUTPUT_IPA" ]; then
            echo "::error::No IPA package was found. Check compilation logs above."
            exit 1
          fi
          cp "$OUTPUT_IPA" EscapeOS.ipa

      - name: Export IPA as Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-Final-IPA
          path: EscapeOS.ipa
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" EscapeOS.ipa \
            --title "EscapeOS Release v1.0.${{ github.run_number }}" \
            --notes "Automated clean build bypassing problematic actions wrapper." || true
