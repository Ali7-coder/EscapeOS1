name: Build EscapeOSPro

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Remove untrusted tap
        run: |
          brew untap aws/tap || true

      - name: Install all required build tools
        run: |
          brew install gzip ldid dpkg

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Show Theos version and environment
        run: |
          export THEOS=${{ github.workspace }}/theos
          make --version
          echo "THEOS=$THEOS"
          ls -la

      - name: Build with Theos (verbose)
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1 -j1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          THEOS_VERBOSE: 1

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOSPro-IPA
          path: ./*.ipa

      - name: Create Release and Upload IPA
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          gh release create "$TAG_NAME" ./*.ipa \
            --title "EscapeOSPro ${{ github.run_number }}" \
            --prerelease \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
