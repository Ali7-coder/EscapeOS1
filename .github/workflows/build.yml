name: Build EscapeOSPro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          echo
          echo "Current Xcode:"
          xcodebuild -version

          echo
          echo "Current Swift:"
          swift --version

      - name: Select compatible Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.3.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.2.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.1.app/Contents/Developer"
          else
            echo "No expected Xcode 16.x installation was found."
            echo "Available Xcode installations:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          echo
          echo "Selected developer directory:"
          xcode-select -p

          echo
          echo "Selected Xcode:"
          xcodebuild -version

          echo
          echo "Selected Swift:"
          swift --version

      - name: Remove untrusted tap
        run: |
          brew untap aws/tap || true

      - name: Install required build tools
        run: |
          brew install gzip ldid dpkg

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Verify Theos and SDK
        run: |
          export THEOS="${{ github.workspace }}/theos"

          echo "======================================"
          echo "THEOS"
          echo "======================================"
          echo "THEOS=$THEOS"

          echo
          echo "======================================"
          echo "XCODE"
          echo "======================================"
          xcodebuild -version

          echo
          echo "======================================"
          echo "SWIFT"
          echo "======================================"
          swift --version

          echo
          echo "======================================"
          echo "AVAILABLE THEOS SDKS"
          echo "======================================"
          find "$THEOS/sdks" -maxdepth 1 -type d -print

          echo
          echo "======================================"
          echo "IPHONEOS 16.5 SDK"
          echo "======================================"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk" || true

      - name: Build with Theos
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          THEOS_VERBOSE: 1
        run: |
          export THEOS="${{ github.workspace }}/theos"

          make clean || true

          make package FINALPACKAGE=1 -j1

      - name: Find generated files
        run: |
          echo "======================================"
          echo "IPA FILES"
          echo "======================================"

          find . -type f -name "*.ipa" -print || true

          echo
          echo "======================================"
          echo "DEB FILES"
          echo "======================================"

          find . -type f -name "*.deb" -print || true

          echo
          echo "======================================"
          echo "APP BUNDLES"
          echo "======================================"

          find . -type d -name "*.app" -print || true

      - name: Prepare IPA
        run: |
          set -e

          IPA=$(find . -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA was generated."

            echo
            echo "Generated files:"
            find . -type f | sort

            exit 1
          fi

          echo "Found IPA:"
          echo "$IPA"

          cp "$IPA" EscapeOSPro.ipa

          echo
          echo "Final IPA:"
          ls -lh EscapeOSPro.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOSPro-IPA
          path: EscapeOSPro.ipa
          if-no-files-found: error

      - name: Create Release and Upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"

          gh release create "$TAG_NAME" \
            EscapeOSPro.ipa \
            --title "EscapeOSPro ${{ github.run_number }}" \
            --prerelease \
            --generate-notes
