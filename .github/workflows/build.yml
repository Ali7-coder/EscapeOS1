name: Build EscapeOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build EscapeOS
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          brew install ldid dpkg gzip

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: "${{ github.workspace }}/theos"
          theos-src: "https://github.com/theos/theos"
          theos-sdks: "https://github.com"

      - name: Fix SDK Compatibility
        run: |
          export THEOS="${{ github.workspace }}/theos"
          # تحميل الـ SDK المضمون للمشروع وفك ضغطه داخل مجلد Theos المخصص
          curl -LO https://github.com/raw/master/iPhoneOS16.5.sdk.tar.xz
          mkdir -p $THEOS/sdks
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Build EscapeOS
        env:
          THEOS_VERBOSE: 1
        run: |
          set -e
          export THEOS="${{ github.workspace }}/theos"
          
          echo "======================================"
          echo "CLEAN & BUILD"
          echo "======================================"
          make clean || true
          
          # البناء باستخدام الإعدادات المتوافقة مع بنية امتداد bad_query الخاص بـ iOS 18+
          make package \
            FINALPACKAGE=1 \
            TARGET="iphone:clang:16.5:18.0" \
            ARCHS=arm64 \
            -j$(sysctl -n hw.ncpu)

      - name: Find and Prepare IPA
        run: |
          set -e
          echo "======================================"
          echo "GENERATED IPA"
          echo "======================================"
          find . -type f -name "*.ipa" -print
          IPA="$(find . -type f -name "*.ipa" -print -quit)"
          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi
          cp "$IPA" EscapeOS.ipa
          ls -lh EscapeOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-IPA
          path: EscapeOS.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # سيقوم هذا الإجراء برفع التطبيق تلقائياً في قسم الإصدارات (Releases)
          gh release create "build-${{ github.run_number }}" EscapeOS.ipa \
            --title "EscapeOS Build #${{ github.run_number }}" \
            --notes "Automated build of EscapeOS from main branch." || true
