name: Build EscapeOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          set -e

          echo "======================================"
          echo "XCODE"
          echo "======================================"
          xcodebuild -version

          echo
          echo "======================================"
          echo "SWIFT"
          echo "======================================"
          swift --version

          echo
          echo "======================================"
          echo "IPHONEOS SDK"
          echo "======================================"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools
        run: |
          brew install gzip ldid dpkg

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Verify Theos SDK
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          echo "======================================"
          echo "THEOS SDKs"
          echo "======================================"

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print \
            | sort

          echo
          echo "Checking iPhoneOS16.5.sdk..."

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "iPhoneOS16.5.sdk FOUND"

      - name: Build
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          echo "======================================"
          echo "BUILD CONFIGURATION"
          echo "======================================"

          echo "THEOS=$THEOS"
          echo "SDKVERSION=16.5"

          echo
          echo "======================================"
          echo "CLEAN"
          echo "======================================"

          make clean || true

          echo
          echo "======================================"
          echo "BUILD"
          echo "======================================"

          make package \
            FINALPACKAGE=1 \
            TARGET=iphone:clang:16.5:18.0 \
            SDKVERSION=16.5 \
            -j1

      - name: Find IPA
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR IPA"
          echo "======================================"

          find . -type f -name "*.ipa" -print

          IPA=$(find . -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          cp "$IPA" EscapeOS.ipa

          ls -lh EscapeOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-IPA
          path: EscapeOS.ipa
          if-no-files-found: error
