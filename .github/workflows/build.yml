name: Build EscapeOSPro
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Remove untrusted tap
        run: |
          brew untap aws/tap || true
      - name: Install all required build tools
        run: |
          brew install gzip ldid dpkg
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
      - name: Show Theos version and environment
        run: |
          export THEOS="${{ github.workspace }}/theos"
          echo "THEOS=$THEOS"
          echo "Theos directory:"
          ls -la "$THEOS"
          echo "SDK directory:"
          ls -la "$THEOS/sdks"
          make --version
      - name: Build with Theos
        run: |
          export THEOS="${{ github.workspace }}/theos"
          make clean || true
          make package FINALPACKAGE=1 -j1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          THEOS_VERBOSE: 1
      - name: Find generated IPA
        run: |
          echo "Searching for IPA..."
          find . -type f -name "*.ipa" -print
          echo "Searching for DEB..."
          find . -type f -name "*.deb" -print
          echo "Searching for APP..."
          find . -type d -name "*.app" -print
      - name: Prepare IPA
        run: |
          IPA=$(find . -type f -name "*.ipa" -print -quit)
          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA was generated."
            echo "Files generated by the build:"
            find . -type f | sort
            exit 1
          fi
          echo "Found IPA: $IPA"
          cp "$IPA" EscapeOSPro.ipa
          ls -lh EscapeOSPro.ipa
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOSPro-IPA
          path: EscapeOSPro.ipa
          if-no-files-found: error
      - name: Create Release and Upload IPA
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            EscapeOSPro.ipa \
            --title "EscapeOSPro ${{ github.run_number }}" \
            --prerelease \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
