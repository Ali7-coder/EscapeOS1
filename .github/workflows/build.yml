name: Build EscapeOSPro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode and Swift
        run: |
          echo "======================================"
          echo "XCODE"
          echo "======================================"
          xcodebuild -version

          echo
          echo "======================================"
          echo "SWIFT"
          echo "======================================"
          swift --version

      - name: Remove untrusted tap
        run: |
          brew untap aws/tap || true

      - name: Install required build tools
        run: |
          brew install gzip ldid dpkg

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Install iPhoneOS 18.6 SDK
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          echo "======================================"
          echo "Installing iPhoneOS 18.6 SDK"
          echo "======================================"

          rm -rf iOS-SDKs

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://github.com/Tonwalter888/iOS-SDKs.git \
            iOS-SDKs

          cd iOS-SDKs

          git sparse-checkout set iPhoneOS18.6.sdk

          SDK_PATH="$(pwd)/iPhoneOS18.6.sdk"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: iPhoneOS18.6.sdk was not downloaded."
            exit 1
          fi

          cp -R "$SDK_PATH" "$THEOS/sdks/"

          cd ..

          echo
          echo "Installed SDKs:"
          find "$THEOS/sdks" -maxdepth 1 -type d -name "iPhoneOS*.sdk" -print

          echo
          echo "Checking iPhoneOS18.6.sdk:"
          ls -ld "$THEOS/sdks/iPhoneOS18.6.sdk"

      - name: Verify SDK
        run: |
          export THEOS="${{ github.workspace }}/theos"

          echo "======================================"
          echo "THEOS"
          echo "======================================"
          echo "THEOS=$THEOS"

          echo
          echo "======================================"
          echo "AVAILABLE IPHONE SDKs"
          echo "======================================"

          find "$THEOS/sdks" \
            -maxdepth 1 \
            -type d \
            -name "iPhoneOS*.sdk" \
            -print \
            | sort -V

          echo
          echo "======================================"
          echo "iPhoneOS18.6 SDK"
          echo "======================================"

          if [ ! -d "$THEOS/sdks/iPhoneOS18.6.sdk" ]; then
            echo "ERROR: iPhoneOS18.6.sdk does not exist."
            exit 1
          fi

          ls -ld "$THEOS/sdks/iPhoneOS18.6.sdk"

      - name: Build with Theos
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          THEOS_VERBOSE: 1
        run: |
          set -e

          export THEOS="${{ github.workspace }}/theos"

          echo "======================================"
          echo "BUILD CONFIGURATION"
          echo "======================================"

          echo "THEOS=$THEOS"
          echo "SDKVERSION=18.6"
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "Swift:"
          swift --version

          echo
          echo "======================================"
          echo "CLEAN"
          echo "======================================"

          make clean || true

          echo
          echo "======================================"
          echo "BUILD"
          echo "======================================"

          make package \
            FINALPACKAGE=1 \
            SDKVERSION=18.6 \
            -j1

      - name: Find generated files
        run: |
          echo "======================================"
          echo "IPA FILES"
          echo "======================================"

          find . -type f -name "*.ipa" -print || true

          echo
          echo "======================================"
          echo "DEB FILES"
          echo "======================================"

          find . -type f -name "*.deb" -print || true

          echo
          echo "======================================"
          echo "APP BUNDLES"
          echo "======================================"

          find . -type d -name "*.app" -print || true

      - name: Prepare IPA
        run: |
          set -e

          IPA="$(find . -type f -name "*.ipa" -print -quit)"

          if [ -z "$IPA" ]; then
            echo "ERROR: No IPA was generated."

            echo
            echo "Generated files:"
            find . -type f | sort

            exit 1
          fi

          echo "Found IPA:"
          echo "$IPA"

          cp "$IPA" EscapeOSPro.ipa

          echo
          echo "Final IPA:"
          ls -lh EscapeOSPro.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOSPro-IPA
          path: EscapeOSPro.ipa
          if-no-files-found: error

      - name: Create Release and Upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="build-${{ github.run_number }}"

          gh release create "$TAG_NAME" \
            EscapeOSPro.ipa \
            --title "EscapeOSPro ${{ github.run_number }}" \
            --prerelease \
            --generate-notes
