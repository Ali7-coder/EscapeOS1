name: Build EscapeOS Local

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native IPA
    runs-on: macos-14
    timeout-minutes: 15
    
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 2. Force Local DNS Fix
        # إجبار سيرفر ماك على استخدام خوادم جوجل للـ DNS لحل مشكلة عدم قراءة الروابط إن وجدت
        run: |
          sudo networksetup -setdnsservers Wi-Fi 8.8.8.8 1.1.1.1 || true
          sudo networksetup -setdnsservers Ethernet 8.8.8.8 1.1.1.1 || true

      - name: 3. Compile Project Using Xcode
        run: |
          set -e
          echo "======================================"
          echo "BUILDING WITH NATIVE XCODE TOOLS"
          echo "======================================"
          
          # البناء المباشر باستخدام المحرك الافتراضي للماك بدون الحاجة لـ Theos الخارجي
          xcodebuild -project "EscapeOS.xcodeproj" \
            -scheme "EscapeOS" \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            DSTROOT="$PWD/build/root" \
            OBJROOT="$PWD/build/obj" \
            SYMROOT="$PWD/build/sym" \
            SHARED_PRECOMPS_DIR="$PWD/build/shared" \
            build

      - name: 4. Package into IPA Format
        run: |
          set -e
          echo "======================================"
          echo "PACKAGING TO IPA FILE"
          echo "======================================"
          
          # تجهيز بنية مجلدات تطبيق الـ iOS الافتراضية
          mkdir -p Payload
          cp -R build/sym/Release-iphoneos/EscapeOS.app Payload/
          
          # ضغط المجلد بصيغة IPA النهائية والتوقيع الوهمي
          zip -r EscapeOS.ipa Payload
          ls -lh EscapeOS.ipa

      - name: 5. Export IPA To GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOS-Final-IPA
          path: EscapeOS.ipa
          if-no-files-found: error
