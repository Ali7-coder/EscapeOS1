# اسم سير العمل
name: Build EscapeOSPro

# متى يتم تشغيله تلقائياً أو يدوياً
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# الصلاحيات المطلوبة لإنشاء الإصدارات
permissions:
  contents: write

# تعريف المهام (Jobs)
jobs:
  build:
    # بيئة التشغيل: أحدث إصدار من macOS
    runs-on: macos-latest
    steps:
      # الخطوة 1: استلام الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # الخطوة 2: تهيئة بيئة Theos
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
        env:
          # تجاوز مشكلة الثقة في Homebrew
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      # الخطوة 3: بناء التطبيق باستخدام Theos
      - name: Build with Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1
        env:
          # تجاوز تحذير Node.js 20 (حل مؤقت)
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      # الخطوة 4: رفع ملف الـ IPA كقطعة أثرية مؤقتة (للتحميل المباشر)
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOSPro-IPA
          path: ./*.ipa

      # الخطوة 5: رفع ملف الـ IPA إلى قسم Releases
      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.ipa
          name: "EscapeOSPro ${{ github.run_number }}"
          tag_name: "v${{ github.run_number }}"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
