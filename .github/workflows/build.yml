name: Build EscapeOSPro

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        # استخدام الإصدار v5 الذي يعمل على Node.js 24 مباشرة [citation:13]
        uses: actions/checkout@v5

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
        env:
          # حل مشكلة ثقة Homebrew في بيئة البناء [citation:3]
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

      - name: Build with Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1

      - name: Upload IPA as Artifact
        # الإصدار v4 يعمل على Node.js 24 بشكل طبيعي [citation:13]
        uses: actions/upload-artifact@v4
        with:
          name: EscapeOSPro-IPA
          path: ./*.ipa

      - name: Create Release and Upload IPA
        # إجراء آخر يعتمد على الأوامر الأساسية، وهو أكثر استقرارًا
        run: |
          TAG_NAME="build-${{ github.run_number }}"
          gh release create "$TAG_NAME" ./*.ipa \
            --title "EscapeOSPro ${{ github.run_number }}" \
            --prerelease \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
